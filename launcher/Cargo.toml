[package]
name = "ocdx-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "ocdx_launcher"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ocdx"
path = "src/main.rs"

[dependencies]
asar = "=0.3.0"
dirs = "=6.0.0"
electron-hook = "=0.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
electron-hook-detours-sys = "=0.1.0"
winapi = { version = "0.3.9", features = [
  "errhandlingapi",
  "fileapi",
  "handleapi",
  "libloaderapi",
  "processthreadsapi",
  "synchapi",
  "winbase",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.19", default-features = false }
